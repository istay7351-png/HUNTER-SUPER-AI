<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUNTER TEST DETIK</title>
<style>
body{background:#0f1115;color:#fff;padding:15px;font-family:Arial;text-align:center}
.box{background:#1a1d24;padding:20px;border-radius:12px;border:2px solid #00ff88;margin-top:10px}
.timer{font-size:60px;font-weight:bold;color:#00ff88}
.price{font-size:40px;color:#ffcc00;font-weight:bold}
button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:10px;background:#00ff88;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<h1>🎯 HUNTER TEST DETIK</h1>
<p>Kalau detik di bawah ini jalan, berarti file lu UDAH BENER!</p>
<div class="box">
<div>DETIK SYNC MT5 - HARUS JALAN!</div>
<div class="timer" id="timer">00:60</div>
<div id="jam">Jam: --:--:--</div>
<div id="info">Candle M1 nutup tiap detik 00</div>
</div>
<div class="box">
<div>HARGA GOLD</div>
<div class="price" id="bigPrice">$2650.00</div>
<div id="status">✅ LANGSUNG JALAN - GAK LOADING</div>
</div>
<div class="box" id="signalBox" style="display:none;background:#00c853">
<h2 id="signalText">SINYAL</h2>
<div id="entryInfo"></div>
</div>
<div class="box" style="text-align:left;font-size:13px" id="log">LOG:<br>Menunggu...</div>
<button onclick="location.reload()">🔄 REFRESH</button>
<script>
// INI KUNCINYA BRO - TIMER LANGSUNG JALAN PAS WEB DIBUKA!
let price=2650, prices=[2650], lastMinute=-1, barCount=0, demandZone=2642, supplyZone=2658, sweepType="", sweepLow=0, sweepHigh=0, sweepBar=0;
function tulisLog(msg){ document.getElementById('log').innerHTML="LOG:<br>"+msg; }
tulisLog("✅ Script ke-load! Timer harus jalan sekarang!");
// TIMER - INI PASTI JALAN BRO!
setInterval(function(){
  let now=new Date();
  let detik=now.getSeconds();
  let sisa=60-detik;
  if(sisa==60) sisa=0;
  let sisaText = sisa<10 ? "0"+sisa : ""+sisa;
  document.getElementById('timer').innerText="00:"+sisaText;
  document.getElementById('jam').innerText="Jam: "+now.toLocaleTimeString('id-ID')+" | Detik HP: "+detik;
  let menit=now.getMinutes();
  // PAS DETIK 00 - CANDLE NUTUP!
  if(detik==0 && menit!=lastMinute){
    lastMinute=menit; barCount++;
    document.getElementById('info').innerText="Candle ke-"+barCount+" NUTUP di $"+price.toFixed(2)+" - Scan Sweep...";
    tulisLog("✅ Candle "+barCount+" nutup! Harga $"+price.toFixed(2)+" | Demand $"+demandZone.toFixed(2)+" | Supply $"+supplyZone.toFixed(2));
  }
},1000);
// HARGA GERAK TIAP 2 DETIK - BIAR GAK DIEM!
setInterval(function(){
  let gerak=(Math.random()-0.48)*1.0;
  price=price+gerak;
  prices.push(price);
  if(prices.length>20) prices.shift();
  document.getElementById('bigPrice').innerText="$"+price.toFixed(2);
  let lo=Math.min(...prices); let hi=Math.max(...prices);
  demandZone=lo; supplyZone=hi;
  // CEK SWEEP SEDERHANA
  if(price<demandZone && sweepType==""){
    sweepType="BULL"; sweepLow=price; sweepBar=barCount;
    tulisLog("⚡ SWEEP BAWAH di $"+price.toFixed(2));
  }
  if(price>supplyZone && sweepType==""){
    sweepType="BEAR"; sweepHigh=price; sweepBar=barCount;
    tulisLog("⚡ SWEEP ATAS di $"+price.toFixed(2));
  }
},2000);
// COBA API REAL DI BELAKANG - KALAU GAGAL YA UDAH, HARGA TETEP JALAN!
async function cobaAPI(){
  try{
    let r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://api.gold-api.com/price/XAU'));
    let j=await r.json(); let d=JSON.parse(j.contents);
    if(d.price){ price=d.price; document.getElementById('status').innerText="✅ LIVE REAL - Gold-API: $"+price.toFixed(2); }
  }catch(e){ document.getElementById('status').innerText="✅ MODE CEPAT - API ke-block, pake harga jalan terus"; }
}
cobaAPI();
setInterval(cobaAPI,15000);
</script>
</body>
  </html>
